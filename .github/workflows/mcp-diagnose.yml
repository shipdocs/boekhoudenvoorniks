name: Diagnose koppeling Windows (#191, tijdelijk)
on:
  push:
    branches: [claude/mcp-windows-191]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/mcp-probe/run.cjs
