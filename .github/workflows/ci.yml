name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Website-Worker (workers/site): eigen package met wrangler. Bundelen met een dry-run (geen account
  # nodig, er wordt niets gedeployd). De licentie- en assistent-Worker staan in de privé-repo
  # shipdocs/boekhoudenvoorniks-server, met hun eigen CI.
  site-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/site/package-lock.json
      - run: npm ci
      - run: npm run check

  # End-to-end: de echte schermen in Chromium, met de echte services (zie e2e/ en playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rapport
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7

  # Verpakt de app en start hem echt: vangt ontbrekende runtime-afhankelijkheden in het installatiepakket.
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --dir --publish never
      - name: Rooktest verpakte app
        run: BOEKHOUDENVOORNIKS_SMOKE_TEST=1 BOEKHOUDENVOORNIKS_DATA="$RUNNER_TEMP/smoke" timeout 120 xvfb-run -a release/linux-unpacked/boekhoudenvoorniks --no-sandbox
