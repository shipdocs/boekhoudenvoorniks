name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # De gegevensmap en het overzetten ervan (tests/data-dir.test.ts) gedragen zich op Windows anders:
  # bestandssloten, schijfletters en backslashes. Daarom draaien die tests ook daar.
  data-dir-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run rebuild:node
      - run: npx vitest run tests/data-dir.test.ts tests/backup.test.ts tests/path-security.test.ts

  # Website-Worker (workers/site): eigen package met wrangler. Bundelen met een dry-run (geen account
  # nodig, er wordt niets gedeployd). De licentie- en assistent-Worker staan in de privé-repo
  # shipdocs/boekhoudenvoorniks-server, met hun eigen CI.
  site-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/site/package-lock.json
      - run: npm ci
      - run: npm run check

  # End-to-end: de echte schermen in Chromium, met de echte services (zie e2e/ en playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rapport
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7

  # Verpakt de app en start hem echt: vangt ontbrekende runtime-afhankelijkheden in het installatiepakket.
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --dir --publish never
      - name: Rooktest verpakte app
        run: BOEKHOUDENVOORNIKS_SMOKE_TEST=1 BOEKHOUDENVOORNIKS_DATA="$RUNNER_TEMP/smoke" timeout 120 xvfb-run -a release/linux-unpacked/boekhoudenvoorniks --no-sandbox
      # Een installatie van vóór de gedeelde gegevensmap nabootsen: de verpakte app zet de oude map over
      # naar ~/BoekhoudenVoorNiks en start daarna gewoon vanuit de nieuwe map.
      - name: Rooktest overzetten van de gegevensmap
        run: |
          app() { BOEKHOUDENVOORNIKS_SMOKE_TEST=1 timeout 120 xvfb-run -a release/linux-unpacked/boekhoudenvoorniks --no-sandbox; }
          old="$HOME/.config/boekhoudenvoorniks"
          BOEKHOUDENVOORNIKS_DATA="$old" app
          test -f "$old/boekhouding.sqlite"
          app
          test -f "$HOME/BoekhoudenVoorNiks/migratie-klaar"
          test -f "$HOME/BoekhoudenVoorNiks/boekhouding.sqlite"
          test ! -e "$old"
          ls -d "$old".gemigreerd-*
          app

  # Hetzelfde op Windows, met de echte installer erbij: die is als artefact te downloaden om een
  # upgrade met de hand te proberen (docs/handmatige-test-datamap-windows.md). Er wordt niets gepubliceerd.
  package-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Rooktest verpakte app en overzetten van de gegevensmap
        shell: pwsh
        run: |
          function Start-App([string]$data) {
            $env:BOEKHOUDENVOORNIKS_SMOKE_TEST = '1'
            if ($data) { $env:BOEKHOUDENVOORNIKS_DATA = $data } else { Remove-Item Env:BOEKHOUDENVOORNIKS_DATA -ErrorAction SilentlyContinue }
            $p = Start-Process -FilePath "release\win-unpacked\BoekhoudenVoorNiks.exe" -PassThru -NoNewWindow
            $null = $p.Handle  # nodig zodat ExitCode na afloop beschikbaar is
            try {
              Wait-Process -Id $p.Id -Timeout 120 -ErrorAction Stop
            } catch {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw 'Rooktest mislukt: de app sloot niet binnen 120 seconden af'
            }
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "Rooktest mislukt (exit $($p.ExitCode))" }
          }
          function Assert-Path([string]$path) { if (-not (Test-Path $path)) { throw "Ontbreekt: $path" } }

          Start-App "$env:RUNNER_TEMP\smoke"

          $old = "$env:APPDATA\boekhoudenvoorniks"
          $shared = "$env:USERPROFILE\BoekhoudenVoorNiks"
          Start-App $old
          Assert-Path "$old\boekhouding.sqlite"
          Start-App ''
          Assert-Path "$shared\migratie-klaar"
          Assert-Path "$shared\boekhouding.sqlite"
          if (Test-Path $old) { throw "De oude map staat er nog: $old" }
          Assert-Path "$old.gemigreerd-*"
          Start-App ''
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7
