name: Release

# Bouwt installers voor Linux en Windows en publiceert ze als GitHub-release;
# electron-updater in de app haalt updates daar vandaan.
# Vóór publicatie draait een rooktest op de verpakte app (start, database, venster, IPC).
# Starten kan op twee manieren: een tag `v*` pushen, of handmatig (workflow_dispatch) op main.
# electron-builder zet alles eerst in een concept-release; pas als Linux én Windows klaar zijn, maakt de
# job `publish` hem openbaar (en daarmee bij handmatig starten ook de tag `v<versie uit package.json>`).
# Zo ziet de updater in de app nooit een release waar latest.yml of latest-linux.yml nog ontbreekt.
# De job `store` bouwt daarnaast het pakket voor de Microsoft Store (MSIX/appx). Dat gaat nooit naar de
# GitHub-release: het blijft een artefact van deze workflow en wordt met de hand naar Partner Center geüpload.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Nooit twee releases tegelijk: ze zouden bestanden in dezelfde concept-release zetten
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versie en tag bepalen
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "Handmatig releasen kan alleen vanaf main" >&2; exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} past niet bij versie $version in package.json" >&2; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Verpakken (zonder installer) voor de rooktest
        run: npx electron-builder ${{ matrix.os == 'windows-latest' && '--win' || '--linux' }} --dir --publish never

      - name: Rooktest verpakte app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: BOEKHOUDENVOORNIKS_SMOKE_TEST=1 BOEKHOUDENVOORNIKS_DATA="$RUNNER_TEMP/smoke" timeout 120 xvfb-run -a release/linux-unpacked/boekhoudenvoorniks --no-sandbox

      - name: Rooktest verpakte app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:BOEKHOUDENVOORNIKS_SMOKE_TEST = '1'
          $env:BOEKHOUDENVOORNIKS_DATA = "$env:RUNNER_TEMP\smoke"
          $p = Start-Process -FilePath "release\win-unpacked\BoekhoudenVoorNiks.exe" -PassThru -NoNewWindow
          $null = $p.Handle  # nodig zodat ExitCode na afloop beschikbaar is
          try {
            Wait-Process -Id $p.Id -Timeout 120 -ErrorAction Stop
          } catch {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Rooktest mislukt: de app sloot niet binnen 120 seconden af'
          }
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "Rooktest mislukt (exit $($p.ExitCode))" }

      - name: Installers bouwen en publiceren
        run: npx electron-builder ${{ matrix.os == 'windows-latest' && '--win' || '--linux' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing: zie issue "Code signing voor de Windows-installer"
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Controlegetallen (SHA-256) bij de release zetten
        shell: bash
        run: |
          shopt -s nullglob
          cd release
          files=(*.AppImage *.deb *.exe)
          # GitHub zet spaties in bestandsnamen om naar '-'; gebruik de naam zoals hij te downloaden is,
          # anders vindt `sha256sum -c` het bestand niet
          : > "SHA256SUMS-${{ runner.os }}.txt"
          for f in "${files[@]}"; do
            echo "$(sha256sum "$f" | cut -d' ' -f1)  ${f// /-}" >> "SHA256SUMS-${{ runner.os }}.txt"
          done
          cat "SHA256SUMS-${{ runner.os }}.txt"
          gh release upload "$RELEASE_TAG" "SHA256SUMS-${{ runner.os }}.txt" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Releasetekst uit CHANGELOG
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          scripts/release-notes.sh "${RELEASE_TAG#v}" > notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Het pakket voor de Microsoft Store (#181), met hetzelfde versienummer als de release. Bewust een eigen
  # job zonder schrijfrechten en zonder token: `build` publiceert alles wat hij bouwt, en een losse MSIX mag
  # nooit op GitHub komen (buiten de Store ondertekent Microsoft hem niet). De release wacht hier niet op.
  store:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Store-pakket bouwen
        run: npx electron-builder --win appx --publish never --x64
      - name: Manifest in het pakket controleren
        run: node scripts/store-manifest.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: store-pakket
          path: release/*.appx
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concept-release openbaar maken
        run: |
          tag="v$(node -p "require('./package.json').version")"
          for f in latest.yml latest-linux.yml SHA256SUMS-Windows.txt SHA256SUMS-Linux.txt; do
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$f" || { echo "$f ontbreekt bij $tag" >&2; exit 1; }
          done
          gh release edit "$tag" --draft=false --latest --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
